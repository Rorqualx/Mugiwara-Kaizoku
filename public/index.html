<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mugiwara Kaizoku</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .logo {
            max-width: 200px;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .button {
            display: inline-block;
            background-color: #4a6cf7;
            color: white;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-radius: 4px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #3451b2;
        }
    </style>
</head>
<body>
    <img src="/kaizoku.png" alt="Mugiwara Kaizoku Logo" class="logo">
    <h1>Mugiwara Kaizoku</h1>
    <p>The Manga management application is currently undergoing maintenance. Please check back soon.</p>
    <a href="/login" class="button">Try to Login</a>
</body>
</html>
