<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Mugiwara Kaizoku</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .offline-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            fill: #999;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #222;
        }
        
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #666;
            margin-bottom: 20px;
        }
        
        .offline-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .secondary-button {
            background-color: transparent;
            color: #007bff;
            border: 1px solid #007bff;
        }
        
        .secondary-button:hover {
            background-color: #f0f8ff;
        }
        
        .offline-status {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-size: 14px;
            color: #666;
        }
        
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a1a1a;
                color: #e0e0e0;
            }
            
            .offline-container {
                background: #2a2a2a;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            }
            
            h1 {
                color: #e0e0e0;
            }
            
            p {
                color: #aaa;
            }
            
            .offline-status {
                background-color: #333;
                color: #aaa;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <svg class="offline-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 9l2-2v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l2 2V3l-2-2H3L1 3v6zm2-6h18v12H3V3zm9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0-2a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
            <path d="M1 1l22 22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Some features may not be available until you're back online.</p>
        
        <div class="offline-status" id="offline-status">
            Checking connection...
        </div>
        
        <div class="offline-actions">
            <button onclick="retryConnection()">Retry Connection</button>
            <button class="secondary-button" onclick="goBack()">Go Back</button>
        </div>
    </div>
    
    <script>
        // Check connection status
        function checkConnection() {
            const statusEl = document.getElementById('offline-status');
            
            if (navigator.onLine) {
                statusEl.textContent = 'Connection restored! Redirecting...';
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
            } else {
                statusEl.textContent = 'Still offline. Your downloaded manga is still available.';
            }
        }
        
        // Retry connection
        function retryConnection() {
            const statusEl = document.getElementById('offline-status');
            statusEl.textContent = 'Checking connection...';
            
            // Try to fetch a small resource
            fetch('/api/ping', { method: 'HEAD' })
                .then(() => {
                    statusEl.textContent = 'Connection restored! Redirecting...';
                    setTimeout(() => {
                        window.location.reload();
                    }, 1500);
                })
                .catch(() => {
                    statusEl.textContent = 'Still offline. Please check your internet connection.';
                });
        }
        
        // Go back
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '/';
            }
        }
        
        // Listen for online/offline events
        window.addEventListener('online', checkConnection);
        window.addEventListener('offline', checkConnection);
        
        // Check connection on load
        setTimeout(checkConnection, 1000);
    </script>
</body>
</html>
