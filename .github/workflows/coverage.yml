name: Test Coverage

on:
  # Run weekly to track coverage trends
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight
  # Allow manual triggering
  workflow_dispatch:

jobs:
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run tests with coverage
      - name: Run tests with coverage
        run: bun run test:coverage

      # Generate coverage report
      - name: Generate coverage report
        run: |
          echo "## Test Coverage Report" > coverage-report.md
          echo "### Summary" >> coverage-report.md
          echo '```' >> coverage-report.md
          cat coverage/coverage-summary.json | jq -r '.total | "\nStatements: \(.statements.pct)%\nBranches: \(.branches.pct)%\nFunctions: \(.functions.pct)%\nLines: \(.lines.pct)%"' >> coverage-report.md
          echo '```' >> coverage-report.md
          
          echo "### Detailed Coverage" >> coverage-report.md
          echo "| File | % Statements | % Branches | % Functions | % Lines |" >> coverage-report.md
          echo "| ---- | ------------ | ---------- | ----------- | ------- |" >> coverage-report.md
          
          cat coverage/coverage-summary.json | jq -r '.["src"] | to_entries[] | select(.key != "total") | "\(.key) | \(.value.statements.pct)% | \(.value.branches.pct)% | \(.value.functions.pct)% | \(.value.lines.pct)%"' >> coverage-report.md

      # Upload coverage report
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage-report.md
            coverage/**

      # Create or update coverage report issue
      - name: Create or update coverage report issue
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ secrets.COVERAGE_ISSUE_NUMBER || '1' }}
          body-file: coverage-report.md
          edit-mode: replace

      # Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Optional if repo is public
          file: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true