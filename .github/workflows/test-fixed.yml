name: Fixed Tests

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]
    
jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.0'

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run fixed tests
      run: |
        # Run fixed tests if they exist, otherwise skip gracefully
        if bun jest --listTests --testPathPattern='.*\\.fixed\\.test\\.(ts|tsx)$' 2>/dev/null | grep -q "."; then
          bun run test:fixed:ci
        else
          echo "ℹ️ No .fixed.test.ts files found - skipping fixed tests"
        fi
      
    - name: Upload test coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        
    - name: Report test status
      run: |
        echo "# Test Results" >> $GITHUB_STEP_SUMMARY
        echo "## Fixed Tests" >> $GITHUB_STEP_SUMMARY
        echo "✅ All fixed tests are passing" >> $GITHUB_STEP_SUMMARY