name: Check for Deprecated Imports

# Temporarily disabled: ESLint flat config (eslint.config.mjs) doesn't support
# the legacy .eslintrc format. This workflow needs to be rewritten to use
# a custom ESLint config for deprecated import checking.
# TODO: Rewrite this workflow to use ESLint flat config format

on:
  push:
    branches: [ main, test-fixes ]
  pull_request:
    branches: [ main ]

jobs:
  check-deprecated:
    # Disabled until workflow is updated for ESLint flat config
    if: false
    name: Check for Deprecated Imports
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Check for deprecated imports
        run: bun eslint . --config .eslintrc.deprecated.js --ext .ts,.tsx --format stylish
        # This will run but only warn, not fail the build

      - name: Generate deprecated imports report
        if: always()
        run: |
          echo "# Deprecated Imports Report" > deprecated-imports-report.md
          echo "## Summary" >> deprecated-imports-report.md
          echo "This report identifies usage of deprecated utility imports that need to be migrated." >> deprecated-imports-report.md
          echo "" >> deprecated-imports-report.md
          echo "## Findings" >> deprecated-imports-report.md
          bun eslint . --config .eslintrc.deprecated.js --ext .ts,.tsx --format markdown >> deprecated-imports-report.md || true
      
      - name: Upload deprecated imports report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deprecated-imports-report
          path: deprecated-imports-report.md
          retention-days: 14