name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image names
        id: images
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          GHCR_IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "ghcr=${GHCR_IMG}" >> "$GITHUB_OUTPUT"
          if [ -n "${DH_USER}" ]; then
            echo "hub_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "hub_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "list<<EOF"
            echo "${GHCR_IMG}"
            if [ -n "${DH_USER}" ]; then
              echo "${DH_USER}/mugiwara-kaizoku"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.images.outputs.hub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Mugiwara-Kaizoku
            org.opencontainers.image.description=Self-hosted manga library manager
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64-only for v0.9. Re-add linux/arm64 once the amd64 build
          # is reliably green; QEMU emulation of arm64 is the slow path
          # and we don't want to bottleneck iteration on it yet.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
