rules:
  # ===========================================
  # tRPC Security Rules
  # ===========================================

  - id: trpc-missing-auth-on-mutation
    pattern: |
      export const $PROC = publicProcedure.mutation(...)
    message: "Mutation uses publicProcedure (unauthenticated). Use protectedProcedure or adminProcedure for mutations."
    languages: [typescript]
    severity: ERROR
    metadata:
      category: authentication
      cwe: "CWE-862: Missing Authorization"
      owasp: "A01:2021 – Broken Access Control"
    paths:
      include:
        - "src/server/routers/**"
        - "src/server/api/**"

  - id: trpc-missing-input-validation
    pattern-either:
      - pattern: |
          export const $PROC = $PROCEDURE.mutation(async ({ ctx }) => { ... })
      - pattern: |
          export const $PROC = $PROCEDURE.query(async ({ ctx }) => { ... })
    pattern-not: |
      export const $PROC = $PROCEDURE.input(...).mutation(...)
    message: "tRPC procedure missing input validation schema (.input())"
    languages: [typescript]
    severity: WARNING
    metadata:
      category: input-validation
      cwe: "CWE-20: Improper Input Validation"

  - id: trpc-missing-authorization-check
    pattern: |
      export const $PROC = protectedProcedure.mutation(async ({ input, ctx }) => {
        ...
        await ctx.db.$RESOURCE.update(...)
        ...
      })
    pattern-not-inside: |
      if ($CHECK) {
        throw new TRPCError(...)
      }
    message: "Protected mutation may be missing authorization check before resource modification"
    languages: [typescript]
    severity: WARNING
    metadata:
      category: authorization
      cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"

  # ===========================================
  # Prisma Security Rules
  # ===========================================

  - id: prisma-raw-sql-injection
    pattern-either:
      - pattern: |
          $DB.$queryRaw`...${$VAR}...`
      - pattern: |
          $DB.$executeRaw`...${$VAR}...`
    message: "Raw SQL query with string interpolation detected (SQL injection risk). Use Prisma.sql tagged template with proper escaping."
    languages: [typescript]
    severity: ERROR
    metadata:
      category: sql-injection
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 – Injection"

  - id: prisma-missing-transaction
    patterns:
      - pattern-inside: |
          async function $FUNC(...) {
            ...
          }
      - pattern: |
          await $DB.$MODEL.create(...)
      - pattern: |
          await $DB.$MODEL.update(...)
      - pattern-not-inside: |
          await $DB.$transaction(...)
    message: "Multiple database operations without transaction (atomicity risk)"
    languages: [typescript]
    severity: WARNING
    metadata:
      category: race-conditions

  # ===========================================
  # Cryptography Rules
  # ===========================================

  - id: weak-crypto-md5
    pattern-either:
      - pattern: |
          createHash('md5')
      - pattern: |
          createHash("md5")
    message: "MD5 is cryptographically broken. Use bcrypt for passwords, SHA-256+ for hashing."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: crypto
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"

  - id: weak-crypto-sha1
    pattern-either:
      - pattern: |
          createHash('sha1')
      - pattern: |
          createHash("sha1")
    message: "SHA-1 is cryptographically broken. Use bcrypt for passwords, SHA-256+ for hashing."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: crypto
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"

  - id: insecure-random-for-security
    pattern-either:
      - pattern: |
          Math.random(...). ... .$METHOD
      - pattern: |
          const $VAR = Math.random(...)
          ...
          $VAR. ... .$TOKEN_METHOD
    pattern-regex: ".*(token|secret|key|password|nonce|salt).*"
    message: "Math.random() is not cryptographically secure. Use crypto.randomBytes()."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: crypto
      cwe: "CWE-338: Use of Cryptographically Weak PRNG"

  # ===========================================
  # Authentication / Session Management
  # ===========================================

  - id: token-in-localstorage
    pattern-either:
      - pattern: |
          localStorage.setItem($KEY, $TOKEN)
      - pattern: |
          localStorage.$KEY = $TOKEN
    pattern-regex: ".*(token|auth|jwt|session).*"
    message: "Storing auth tokens in localStorage is vulnerable to XSS. Use httpOnly cookies."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: authentication
      cwe: "CWE-522: Insufficiently Protected Credentials"
      owasp: "A07:2021 – Identification and Authentication Failures"

  - id: token-in-sessionstorage
    pattern-either:
      - pattern: |
          sessionStorage.setItem($KEY, $TOKEN)
      - pattern: |
          sessionStorage.$KEY = $TOKEN
    pattern-regex: ".*(token|auth|jwt|session).*"
    message: "Storing auth tokens in sessionStorage is vulnerable to XSS. Use httpOnly cookies."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: authentication
      cwe: "CWE-522: Insufficiently Protected Credentials"

  - id: missing-httponly-cookie
    pattern: |
      res.cookie($NAME, $VALUE, { ... })
    pattern-not: |
      res.cookie($NAME, $VALUE, { ..., httpOnly: true, ... })
    pattern-regex: ".*(token|auth|session).*"
    message: "Authentication cookie missing httpOnly flag"
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: authentication

  # ===========================================
  # XSS Prevention
  # ===========================================

  - id: dangerous-innerhtml
    pattern-either:
      - pattern: |
          dangerouslySetInnerHTML={{ __html: $VAR }}
      - pattern: |
          dangerouslySetInnerHTML={{__html:$VAR}}
    message: "dangerouslySetInnerHTML can lead to XSS. Sanitize input with DOMPurify or use safe rendering."
    languages: [typescript, typescriptreact, javascript, javascriptreact]
    severity: WARNING
    metadata:
      category: xss
      cwe: "CWE-79: Cross-site Scripting"
      owasp: "A03:2021 – Injection"

  - id: direct-innerhtml-assignment
    pattern: |
      $ELEM.innerHTML = $VAR
    message: "Direct innerHTML assignment can lead to XSS. Use textContent or React rendering."
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: xss
      cwe: "CWE-79: Cross-site Scripting"

  # ===========================================
  # Code Execution
  # ===========================================

  - id: dangerous-eval
    pattern-either:
      - pattern: |
          eval($CODE)
      - pattern: |
          new Function($CODE)
    message: "eval() and Function constructor are extremely dangerous. Avoid dynamic code execution."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: code-execution
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"

  # ===========================================
  # TOCTOU / Race Conditions
  # ===========================================

  - id: toctou-check-then-act
    patterns:
      - pattern-inside: |
          async function $FUNC(...) {
            ...
          }
      - pattern: |
          const $VAR = await $DB.$MODEL.findUnique(...)
      - pattern: |
          await $DB.$MODEL.update(...)
      - pattern-not-inside: |
          await $DB.$transaction(...)
    message: "Possible TOCTOU race condition: Check-then-act without transaction"
    languages: [typescript]
    severity: WARNING
    metadata:
      category: race-conditions
      cwe: "CWE-367: Time-of-check Time-of-use Race Condition"

  # ===========================================
  # Secrets Detection
  # ===========================================

  - id: hardcoded-api-key
    pattern-regex: "(?i)(api[_-]?key|apikey)\\s*=\\s*['\"][a-zA-Z0-9_-]{20,}['\"]"
    message: "Hardcoded API key detected. Move to environment variable."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: secrets
      cwe: "CWE-798: Use of Hard-coded Credentials"

  - id: hardcoded-password
    pattern-regex: "(?i)(password|passwd|pwd)\\s*=\\s*['\"][^'\"\\s]{8,}['\"]"
    message: "Hardcoded password detected. Move to environment variable and hash properly."
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      category: secrets
      cwe: "CWE-798: Use of Hard-coded Credentials"

  # ===========================================
  # Input Validation
  # ===========================================

  - id: missing-zod-validation
    pattern: |
      export const $PROC = $PROCEDURE.mutation(async ({ input, ctx }) => {
        ...
      })
    pattern-not: |
      export const $PROC = $PROCEDURE.input(z.object(...)).mutation(...)
    message: "Mutation missing Zod input validation"
    languages: [typescript]
    severity: WARNING
    metadata:
      category: input-validation
      cwe: "CWE-20: Improper Input Validation"

  # ===========================================
  # Authorization
  # ===========================================

  - id: missing-ownership-check
    patterns:
      - pattern-inside: |
          export const $PROC = protectedProcedure.mutation(async ({ input, ctx }) => {
            ...
          })
      - pattern: |
          await ctx.db.$MODEL.delete({ where: { id: input.id } })
      - pattern-not-inside: |
          if ($RESOURCE.userId !== ctx.session.user.id) {
            throw new TRPCError({ code: 'FORBIDDEN' })
          }
    message: "Protected mutation may be missing ownership verification before deletion"
    languages: [typescript]
    severity: ERROR
    metadata:
      category: authorization
      cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"
      owasp: "A01:2021 – Broken Access Control"

  # ===========================================
  # Performance / DoS
  # ===========================================

  - id: unbounded-findmany
    pattern: |
      $DB.$MODEL.findMany({ ... })
    pattern-not: |
      $DB.$MODEL.findMany({ ..., take: $N, ... })
    message: "findMany query without pagination limit (potential DoS)"
    languages: [typescript]
    severity: WARNING
    metadata:
      category: performance
      cwe: "CWE-400: Uncontrolled Resource Consumption"

  # ===========================================
  # Next.js Specific
  # ===========================================

  - id: nextjs-api-no-cors
    pattern-inside: |
      export default async function handler(req, res) {
        ...
      }
    pattern-not: |
      res.setHeader('Access-Control-Allow-Origin', ...)
    message: "Next.js API route missing CORS headers"
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: security-misconfiguration
    paths:
      include:
        - "pages/api/**"
        - "app/api/**"
