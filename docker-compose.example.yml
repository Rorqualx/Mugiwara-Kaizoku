# Mugiwara-Kaizoku + a torrent client sharing one downloads volume.
#
# The shared `downloads_volume` makes the path-mapping identity rule work
# end-to-end: Transmission writes to /downloads, Kaizoku reads from
# /downloads, same path = same volume = no translation needed.
#
# Swap Transmission for qBittorrent / Deluge / SABnzbd if you prefer —
# keep the same `/downloads` mount on both services.

services:
  kaizoku:
    image: ghcr.io/rorqualx/mugiwara-kaizoku:latest
    container_name: kaizoku
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DOWNLOAD_FOLDER: /downloads
    volumes:
      - ${LIBRARY_PATH:-./library}:/library
      - ${CONFIG_PATH:-./config}:/config
      - downloads_volume:/downloads

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: kaizoku_transmission
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - transmission_config:/config
      - downloads_volume:/downloads
    ports:
      - "9091:9091"

volumes:
  transmission_config:
  downloads_volume:
