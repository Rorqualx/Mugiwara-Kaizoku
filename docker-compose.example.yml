# Example Compose stack: Mugiwara-Kaizoku + a torrent client sharing one volume.
#
# This is the "robust" deployment shape: both containers bind the host
# directory `./data/downloads` to `/downloads` inside the container. With
# that arrangement, the torrent client reports `downloadDir: /downloads/...`
# and Mugiwara reads from the same `/downloads/...` — no path mapping
# translation is needed, the identity mapping the seeder writes on first
# boot just works.
#
# Use this as a starting point. Adjust ports, volume locations, and the
# torrent client image to suit your setup. The key invariant is the shared
# `downloads_volume` bind on both services.

version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mugiwara_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaizoku
      POSTGRES_PASSWORD: kaizoku
      POSTGRES_DB: kaizoku
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaizoku -d kaizoku"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mugiwara:
    container_name: mugiwara
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kaizoku:kaizoku@db:5432/kaizoku
      KAIZOKU_PORT: 3000
      TZ: UTC
      # Explicit deployment-mode marker. The detector also auto-detects
      # via `/.dockerenv` but setting this makes intent unambiguous and
      # is the override path for unusual container runtimes.
      MUGIWARA_DEPLOYMENT_MODE: docker
      # First-boot seeder uses this for the default identity mapping.
      # The same path must appear in `volumes:` below and in the torrent
      # client's `volumes:` for the identity mapping to work end-to-end.
      DOWNLOAD_FOLDER: /downloads
    volumes:
      # Persistent app state (config, backups).
      - mugiwara_config:/config
      # SHARED with the torrent client — this is the load-bearing volume.
      - downloads_volume:/downloads
    ports:
      - "3000:3000"

  # Transmission (or swap for qBittorrent / Deluge with the same volume mount).
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: mugiwara_transmission
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
    volumes:
      - transmission_config:/config
      # SAME path as the mugiwara service. This is what makes the identity
      # mapping work — Transmission writes to /downloads, Mugiwara reads
      # from /downloads, both resolve to the same host directory.
      - downloads_volume:/downloads
    ports:
      - "9091:9091"

volumes:
  postgres_data:
  mugiwara_config:
  transmission_config:
  downloads_volume:
    # Replace with a `driver_opts` block to bind a specific host directory:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /path/on/host/to/downloads
