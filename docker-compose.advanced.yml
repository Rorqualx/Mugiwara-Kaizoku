# Mugiwara-Kaizoku — multi-container layout with EXTERNAL Postgres.
#
# Use this if you want to run Postgres separately (existing managed DB,
# different version, shared with other apps). The image is the same as
# the default single-container compose; the entrypoint detects external
# Postgres via DATABASE_URL host and skips the bundled instance.

services:
  db:
    image: postgres:15-alpine
    container_name: kaizoku_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaizoku
      POSTGRES_PASSWORD: kaizoku
      POSTGRES_DB: kaizoku
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaizoku -d kaizoku"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kaizoku:
    image: ghcr.io/rorqualx/mugiwara-kaizoku:latest
    container_name: kaizoku
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://kaizoku:kaizoku@db:5432/kaizoku
    volumes:
      - ${LIBRARY_PATH:-./library}:/library
      - ${CONFIG_PATH:-./config}:/config

volumes:
  postgres_data:
