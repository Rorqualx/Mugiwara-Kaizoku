[package]
name = "kaizoku-desktop"
version = "0.1.0"
description = "Kaizoku as a Windows desktop app"
edition = "2021"
rust-version = "1.77.2"
publish = false

# Its own workspace root, so cargo never goes looking for one above it.
[workspace]

# Pinned to a minor, not a caret: the CLI version in scripts/build/desktop.sh
# must stay on the same Tauri line as the runtime.
[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
tauri = { version = "~2.11.6", features = [] }

# Not used directly. These hold tauri's own crates on the line it was released
# with. tauri 2.11.6 asks for `tauri-runtime ^2.11.3`, which Cargo satisfies
# with 2.12.1, from the next Tauri release, and tauri then fails to compile
# against it (27 errors). Semver says that cannot happen; upstream it did. Move
# these together with `tauri`, never alone, and only by reading what the new
# tauri release depends on.
tauri-runtime = "~2.11.3"
tauri-runtime-wry = "~2.11.4"
tauri-utils = "~2.9.3"
tauri-macros = "~2.6.3"
tauri-codegen = "~2.6.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
