<!DOCTYPE html>
<html>
<head>
    <title>Test Enhanced Metadata for Additional Sources</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #2a2a2a;
        }
        .status { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
        }
        .success { background: #2d4a2b; color: #8bc34a; border: 1px solid #8bc34a; }
        .error { background: #4a2b2b; color: #f44336; border: 1px solid #f44336; }
        .info { background: #2b3a4a; color: #2196f3; border: 1px solid #2196f3; }
        .warning { background: #4a3f2b; color: #ff9800; border: 1px solid #ff9800; }
        pre { 
            background: #1a1a1a; 
            padding: 10px; 
            border-radius: 5px; 
            overflow-x: auto;
            border: 1px solid #444;
        }
        button {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1976d2;
        }
        .provider-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            margin: 2px;
            font-size: 12px;
            font-weight: bold;
        }
        .fandom { background: #7b1fa2; }
        .comicvine { background: #388e3c; }
        .wikipedia { background: #1976d2; }
        .anilist { background: #00bcd4; }
    </style>
</head>
<body>
    <h1>Enhanced Metadata Test for Additional Sources</h1>
    
    <div class="test-section">
        <h2>Test Configuration</h2>
        <div>
            <label>Search Query: </label>
            <input type="text" id="searchQuery" value="Fire Force" style="padding: 5px; width: 200px;">
            <button onclick="runAllTests()">Run All Tests</button>
        </div>
    </div>
    
    <div id="results"></div>
    
    <script>
        const resultsEl = document.getElementById('results');
        
        function log(message, type = 'info', section = null) {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            
            if (section) {
                section.appendChild(div);
            } else {
                resultsEl.appendChild(div);
            }
        }
        
        function createSection(title) {
            const section = document.createElement('div');
            section.className = 'test-section';
            section.innerHTML = `<h3>${title}</h3>`;
            resultsEl.appendChild(section);
            return section;
        }
        
        async function testFandomEnhancement() {
            const section = createSection('🎭 Fandom Enhancement Test');
            
            try {
                // Search for manga in Fandom
                log('Searching Fandom for manga...', 'info', section);
                
                const searchResponse = await fetch('/api/trpc/manga.search?batch=1&input=' + encodeURIComponent(JSON.stringify({
                    "0": { "json": { "source": "fandom", "keyword": document.getElementById('searchQuery').value } }
                })));
                
                const searchData = await searchResponse.json();
                const results = searchData[0]?.result?.data?.json || [];
                
                if (results.length === 0) {
                    log('❌ No Fandom results found', 'error', section);
                    return;
                }
                
                const firstResult = results[0];
                log(`✅ Found: ${firstResult.title}`, 'success', section);
                
                // Check if result already has enhanced fields
                const hasEnhanced = !!(
                    firstResult.volumeCovers?.length ||
                    firstResult.gallery?.length ||
                    firstResult.characterArt?.length
                );
                
                if (hasEnhanced) {
                    log(`✅ Enhanced fields already present:
                        <br>• Volume Covers: ${firstResult.volumeCovers?.length || 0}
                        <br>• Gallery Images: ${firstResult.gallery?.length || 0}
                        <br>• Character Art: ${firstResult.characterArt?.length || 0}`, 
                        'success', section);
                } else {
                    log('⚠️ Basic metadata only - attempting enhancement...', 'warning', section);
                    
                    // Try to fetch enhanced metadata
                    const url = firstResult.wikiUrl || firstResult.url;
                    if (url) {
                        const enhanceResponse = await fetch('/api/trpc/metadata.fetchEnhancedMangaMetadata', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                json: {
                                    mangaPageUrl: url,
                                    includeGallery: true
                                }
                            })
                        });
                        
                        const enhanceData = await enhanceResponse.json();
                        
                        if (enhanceData.result?.data?.json) {
                            const enhanced = enhanceData.result.data.json;
                            log(`✅ Successfully enhanced:
                                <br>• Volume Covers: ${enhanced.coverArt?.volumeCovers?.length || 0}
                                <br>• Gallery Images: ${enhanced.coverArt?.gallery?.length || 0}
                                <br>• Character Art: ${enhanced.coverArt?.characterArt?.length || 0}`, 
                                'success', section);
                                
                            // Show sample volume cover if available
                            if (enhanced.coverArt?.volumeCovers?.length > 0) {
                                const cover = enhanced.coverArt.volumeCovers[0];
                                log(`Sample Volume Cover: ${cover.title || 'Volume ' + cover.volume}`, 'info', section);
                            }
                        } else {
                            log('❌ Enhancement failed', 'error', section);
                        }
                    }
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error', section);
            }
        }
        
        async function testComicVineEnhancement() {
            const section = createSection('🦸 ComicVine Enhancement Test');
            
            try {
                log('Searching ComicVine for manga...', 'info', section);
                
                const searchResponse = await fetch('/api/trpc/manga.search?batch=1&input=' + encodeURIComponent(JSON.stringify({
                    "0": { "json": { "source": "comicvine", "keyword": document.getElementById('searchQuery').value } }
                })));
                
                const searchData = await searchResponse.json();
                const results = searchData[0]?.result?.data?.json || [];
                
                if (results.length === 0) {
                    log('❌ No ComicVine results found', 'error', section);
                    return;
                }
                
                const firstResult = results[0];
                log(`✅ Found: ${firstResult.title}`, 'success', section);
                
                // Check if result has enhanced fields
                const hasEnhanced = !!(
                    firstResult.issues?.length ||
                    firstResult.characters?.length ||
                    firstResult.creators?.length
                );
                
                if (hasEnhanced) {
                    log(`✅ Enhanced fields already present:
                        <br>• Issues: ${firstResult.issues?.length || 0}
                        <br>• Characters: ${firstResult.characters?.length || 0}
                        <br>• Creators: ${firstResult.creators?.length || 0}`, 
                        'success', section);
                } else {
                    log('⚠️ Basic metadata only - needs enhancement for issue details', 'warning', section);
                    
                    // ComicVine enhancement would happen through the enhancer
                    log('Enhancement would fetch detailed issue information', 'info', section);
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error', section);
            }
        }
        
        async function testWikipediaEnhancement() {
            const section = createSection('📚 Wikipedia Enhancement Test');
            
            try {
                log('Searching Wikipedia for manga...', 'info', section);
                
                const searchResponse = await fetch('/api/trpc/manga.search?batch=1&input=' + encodeURIComponent(JSON.stringify({
                    "0": { "json": { "source": "wikipedia", "keyword": document.getElementById('searchQuery').value } }
                })));
                
                const searchData = await searchResponse.json();
                const results = searchData[0]?.result?.data?.json || [];
                
                if (results.length === 0) {
                    log('❌ No Wikipedia results found', 'error', section);
                    return;
                }
                
                const firstResult = results[0];
                log(`✅ Found: ${firstResult.title}`, 'success', section);
                
                // Check if result has enhanced fields
                const hasEnhanced = !!(
                    firstResult.volumeList?.length ||
                    firstResult.chapterList?.length ||
                    firstResult.volumeTables
                );
                
                if (hasEnhanced) {
                    log(`✅ Enhanced fields already present:
                        <br>• Volumes: ${firstResult.volumeList?.length || 0}
                        <br>• Chapters: ${firstResult.totalChapters || 0}
                        <br>• Volume Tables: ${firstResult.volumeTables ? 'Yes' : 'No'}`, 
                        'success', section);
                        
                    // Show sample volume if available
                    if (firstResult.volumeList?.length > 0) {
                        const vol = firstResult.volumeList[0];
                        log(`Sample Volume: ${vol.volumeNumber} - Chapters ${vol.chapterStart}-${vol.chapterEnd}`, 'info', section);
                    }
                } else {
                    log('⚠️ Basic metadata only - needs enhancement for chapter lists', 'warning', section);
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error', section);
            }
        }
        
        async function testIntegration() {
            const section = createSection('🔄 Integration Test - Mix & Match');
            
            try {
                log('Testing metadata enhancement when providers are used as additional sources...', 'info', section);
                
                // This simulates what happens in the UI when selecting additional sources
                log('Scenario: AniList primary, Fandom as additional source', 'info', section);
                
                // First get AniList result
                const anilistResponse = await fetch('/api/trpc/manga.search?batch=1&input=' + encodeURIComponent(JSON.stringify({
                    "0": { "json": { "source": "anilist", "keyword": document.getElementById('searchQuery').value } }
                })));
                
                const anilistData = await anilistResponse.json();
                const anilistResult = anilistData[0]?.result?.data?.json?.[0];
                
                if (!anilistResult) {
                    log('❌ No AniList result found', 'error', section);
                    return;
                }
                
                log(`Primary source: <span class="provider-badge anilist">AniList</span> ${anilistResult.title}`, 'success', section);
                
                // Then search Fandom
                const fandomResponse = await fetch('/api/trpc/manga.search?batch=1&input=' + encodeURIComponent(JSON.stringify({
                    "0": { "json": { "source": "fandom", "keyword": document.getElementById('searchQuery').value } }
                })));
                
                const fandomData = await fandomResponse.json();
                const fandomResult = fandomData[0]?.result?.data?.json?.[0];
                
                if (fandomResult) {
                    log(`Additional source found: <span class="provider-badge fandom">Fandom</span> ${fandomResult.title}`, 'success', section);
                    
                    // Check if Fandom result needs enhancement
                    if (!fandomResult.volumeCovers?.length) {
                        log('🔄 Fandom result needs enhancement for volume covers...', 'warning', section);
                        
                        // This is what the UI should do - enhance the metadata
                        const url = fandomResult.wikiUrl || fandomResult.url;
                        if (url) {
                            log('✅ Enhancement would fetch volume covers, gallery images, etc.', 'success', section);
                        }
                    } else {
                        log('✅ Fandom already has enhanced metadata!', 'success', section);
                    }
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error', section);
            }
        }
        
        async function runAllTests() {
            resultsEl.innerHTML = '';
            
            log('<h2>🚀 Running Enhanced Metadata Tests...</h2>', 'info');
            
            await testFandomEnhancement();
            await testComicVineEnhancement();
            await testWikipediaEnhancement();
            await testIntegration();
            
            log('<h2>✅ All tests complete!</h2>', 'success');
        }
        
        // Run tests on load
        runAllTests();
    </script>
</body>
</html>
